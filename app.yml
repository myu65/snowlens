version: 2
name: SNOWLENS
database: SNOWFLAKE_APPS
schema: APP
query_warehouse: COMPUTE_WH
label: SnowLens
description: Fast table-first Snowflake data exploration
auto_suspend_secs: 300
ignore:
  - node_modules
  - .next
  - .git
  - .env*
  - "*.tsbuildinfo"
  - .snowlens-mock.json
  - .snowlens-e2e.json
  - .snowlens-mock.json.tmp
  - .snowlens-e2e.json.tmp
  - "*.ledgers.json"
  - "*.ledgers.json.*.tmp"
  - playwright-auth
  - artifacts
  - coverage
  - test-results
  - playwright-report
environment_variables:
  - name: SNOWLENS_MODE
    value: snowflake
  - name: SNOWLENS_METADATA_DATABASE
    value: SNOWFLAKE_APPS
  - name: SNOWLENS_METADATA_SCHEMA
    value: APP
  - name: SNOWLENS_LEDGER_SPACES
    value: "[]"
install:
  commands:
    - [npm, ci]
build:
  commands:
    - [npm, run, build]
run:
  command: [npm, start]
